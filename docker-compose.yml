version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: soseguro_db
    environment:
      POSTGRES_USER: cristian
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: soseguro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cristian -d soseguro"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s