<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Avatar Placeholder SOSeguro</title>
  <desc id="desc">Imagen de respaldo para perfil publico cuando no hay fotografia cargada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A5E7A" />
      <stop offset="100%" stop-color="#1E4D65" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" rx="120" />
  <circle cx="600" cy="500" r="360" fill="url(#glow)" />

